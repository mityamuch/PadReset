name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test
      - uses: actions/upload-artifact@v7
        with:
          name: PadReset-windows
          path: dist/PadReset/
          if-no-files-found: error
